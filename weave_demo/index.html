<!-- ===================== 设备切换器 ===================== -->
<div class="device-switcher" id="device-switcher">
  <div class="ds-inner">
    <span class="ds-brand">
      <span class="ds-logo">
        <svg class="icon"><use href="#i-wave"/></svg>
      </span>
      <span class="ds-title">织脑 <em>WeaveBrain</em></span>
      <span class="ds-sub">产品全貌高保真原型</span>
    </span>
    <div class="ds-controls">
      <button class="ds-btn active" data-device="mobile" data-testid="switch-mobile">
        <svg class="icon"><use href="#i-mic"/></svg> 手机端
      </button>
      <button class="ds-btn" data-device="web" data-testid="switch-web">
        <svg class="icon"><use href="#i-search"/></svg> Web 端
      </button>
    </div>
    <span class="ds-hint">点击可交互 · 快捷键 <kbd>Ctrl</kbd>+<kbd>Tab</kbd> 切设备 · <kbd>R</kbd> 录音</span>
  </div>
</div>

<!-- ===================== 舞台（双端容器） ===================== -->
<div class="stage" id="stage">

  <!-- 手机端外框 -->
  <div class="phone-frame" id="phone-frame" data-active="true">
    <div class="phone-body">
      <div class="phone-notch" id="phone-notch"></div>
      <div class="phone-statusbar" id="phone-statusbar"></div>
      <div class="phone-screen" id="mobile-screen">
        <!-- 手机端内容由 render.js 渲染 -->
      </div>
      <div class="phone-homebar" id="phone-homebar"></div>
    </div>
    <div class="phone-label">手机端 · 捕捉主端</div>
  </div>

  <!-- Web 端面板 -->
  <div class="web-panel" id="web-panel">
    <div class="web-screen" id="web-screen">
      <!-- Web 端内容由 render.js 渲染 -->
    </div>
    <div class="web-label">Web 端 · 回顾与生产力大屏</div>
  </div>

</div>

<!-- ===================== 全局弹窗 / Toast 容器 ===================== -->
<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>
