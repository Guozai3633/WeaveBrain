services:
  postgres:
    image: postgres:16-alpine
    container_name: weavebrain-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: weavebrain
      POSTGRES_PASSWORD: weavebrain_dev
      POSTGRES_DB: weavebrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weavebrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    container_name: weavebrain-temporal
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=weavebrain
      - POSTGRES_PWD=weavebrain_dev
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/dev.yaml
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: weavebrain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./WeaveBrain
      dockerfile: Dockerfile
    container_name: weavebrain-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=weavebrain
      - DB_PASSWORD=weavebrain_dev
      - DB_NAME=weavebrain
      - ENCRYPTION_KEY=default-32-byte-encryption-key-!
      - JWT_SECRET=dev-secret-change-in-production
      - TEMPORAL_HOST_PORT=temporal:7233
      - EMBEDDING_BASE_URL=http://ollama:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
