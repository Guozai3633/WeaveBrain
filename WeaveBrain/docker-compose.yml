version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: weavebrain-postgres
    environment:
      POSTGRES_USER: weavebrain
      POSTGRES_PASSWORD: weavebrain_dev
      POSTGRES_DB: weavebrain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weavebrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: weavebrain-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=weavebrain
      - POSTGRES_PWD=weavebrain_dev
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./config/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: weavebrain-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: weavebrain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.1
    container_name: weavebrain-funasr
    ports:
      - "10095:10095"
    volumes:
      - funasr-models:/workspace/models
    command: >
      bash -c "cd /workspace/FunASR/runtime/websocket/build/bin &&
      ./funasr-wss-server
      --download-model-dir /workspace/models
      --model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-onnx
      --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      --punc-dir damo/punc_ct-transformer_cn-en-common-vocab471067-large-onnx
      --decoder-thread-num 4
      --model-thread-num 1
      --io-thread-num 2
      --port 10095
      --certfile ''
      --hotword /workspace/hotwords.txt"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: weavebrain-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  weavebrain:
    build: .
    container_name: weavebrain-api
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=weavebrain
      - DB_PASSWORD=weavebrain_dev
      - DB_NAME=weavebrain
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - ANTHROPIC_BASE_URL=http://ollama:11434/v1
      - ANTHROPIC_API_KEY=ollama
      - EMBEDDING_BASE_URL=http://ollama:11434/v1
      - EMBEDDING_API_KEY=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIM=768
      - STT_PROVIDER=funasr
      - FUNASR_ADDR=funasr:10095
      - REVIEW_PROVIDER=mock
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ollamadata:
  funasr-models:
  redisdata:
